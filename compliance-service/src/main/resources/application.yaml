server:
  port: 8081

app:
  rag:
    top-k: 20                  # number of chunks retrieved per question
    similarity-threshold: 0.3  # chunks below this score are ignored (tune after ingestion)

spring:
  application:
    name: compliance-service

  # Secrets come from environment variables.
  # When running from the IDE, they are read from the .env file in the repository root.
  # In Docker, docker-compose passes them as environment variables.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  # Java 21 virtual threads for request handling
  threads:
    virtual:
      enabled: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o
      embedding:
        options:
          model: text-embedding-3-small # 1536 dimensions

    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_GRPC_PORT:6334}   # gRPC port
        api-key: ${QDRANT_API_KEY}
        use-tls: false
        collection-name: edupulse_rag
        initialize-schema: true          # creates the collection if it does not exist

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: info
    com.edupulse: info
    org.springframework.ai: info
